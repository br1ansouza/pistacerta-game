version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels: [dependencias]
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build:
        patterns: ['@rsbuild/*', 'typescript', 'oxlint', 'prettier', 'wrangler', '@types/bun']
      demais:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: auto
    commit-message:
      prefix: chore
    labels: [dependencias, ci]
