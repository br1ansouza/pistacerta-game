name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Conteúdo
        run: bun run validate:content

      # src/generated/ é artefato de build e não é versionado, mas o
      # typecheck e o build dependem dele.
      - name: Gerar conteúdo do worker
        run: bun run build:worker-content

      - name: Selar conteúdo estático
        run: bun run scripts/build-static-content.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Formatação
        run: bun run format:check

      - name: Build
        run: bun run build
